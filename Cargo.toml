[package]
name = "taxc"
version = "0.16.0"
authors = ["Andrew Jones <ascjones@gmail.com>"]
edition = "2021"
description = "UK Tax Calculator for Capital Gains and Income"

[lib]
name = "taxc"
path = "src/lib.rs"

[[bin]]
name = "taxc"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
pretty_env_logger = "0.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
rust_decimal = { version = "1.42", features = ["serde"] }
rust_decimal_macros = "1.40"
tabled = { version = "0.21", default-features = false, features = ["std"] }
serde_json = "1.0"
opener = "0.8"
thiserror = "2.0"
schemars = { version = "1.2", features = ["chrono04"] }

[dev-dependencies]
headless_chrome = { version = "1.0", features = ["fetch"] }
