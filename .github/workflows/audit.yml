name: Security audit

# rustsec/audit-check fails the job on push, pull_request and
# workflow_dispatch, but only files an issue (still reporting success) on
# schedule. The pull_request trigger is what actually gates a dependency
# change before it reaches master.
on:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [ master ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
